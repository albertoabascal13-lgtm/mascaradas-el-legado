#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(20,6,8,.55),rgba(5,2,4,.92));padding:1rem;overflow-y:auto}
#ov.hide{display:none}
#ov{overflow-y:auto}
#ov.titulo{background:linear-gradient(to bottom,rgba(6,3,8,.92) 0%,rgba(6,3,8,.82) 40%,rgba(6,3,8,.35) 68%,rgba(6,3,8,.05) 100%);justify-content:flex-start;padding-top:3%}
#ov h1{font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:clamp(2rem,7.5vw,4.4rem);line-height:.95;margin:0 0 .35em;color:var(--fg);text-shadow:0 0 18px rgba(158,31,24,.8),0 3px 0 #2a0a08}
#by{font-family:'Pirata One',Georgia,serif;font-size:clamp(.85rem,2.4vw,1.2rem);color:var(--ember);letter-spacing:.08em;margin:-.4em 0 .8em;opacity:.9}
#by.hide{display:none}
#ov p{max-width:34em;margin:0 0 1em;font-size:clamp(.8rem,2.3vw,1.05rem);line-height:1.55;font-style:italic;opacity:.9}
#btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:40em}
#btns button{font-family:'Pirata One',Georgia,serif;font-size:clamp(1rem,3vw,1.4rem);color:var(--fg);background:var(--panel);border:2px solid var(--blood);padding:.3em 1em;cursor:pointer}
#btns button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
#btns button:focus{outline:2px solid var(--ember);outline-offset:3px;background:#2a1216}
#btns button:focus-visible,.pad button:focus-visible,#mute:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
#bn{position:absolute;top:18%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#bn.show{opacity:1}
#bn strong{display:block;font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:clamp(1.6rem,6vw,3rem);text-shadow:0 0 14px rgba(158,31,24,.9)}
#bn span{font-style:italic;font-size:clamp(.8rem,2.2vw,1rem);opacity:.8}
#ov .diario{max-width:38em;text-align:left;font-size:clamp(.72rem,2vw,.95rem);line-height:1.5;max-height:52vh;overflow-y:auto;margin-bottom:.8em}
#ov .recuento{margin-top:.8em;border-top:1px solid var(--line);padding-top:.5em}
#ov .recuento p{display:flex;justify-content:space-between;gap:2em;margin:.15em 0;font-style:normal}
#ov .recuento b{color:var(--fg);font-weight:400}
#ov .recuento .tot b,#ov .recuento .tot span{color:var(--ember);font-size:1.15em}
#ov .recuento .rec b{color:#c9a23a}
#ov .diario i{opacity:.75;display:block;margin-bottom:.6em;color:var(--ember)}
#ov .diario p{font-style:normal;margin:0 0 .7em;max-width:none;font-size:1em;opacity:1}
#dlg{position:absolute;left:4%;right:4%;bottom:5%;background:rgba(12,6,8,.9);border:2px solid var(--blood);padding:.5em .9em .6em;font-size:clamp(.78rem,2.3vw,1.05rem);line-height:1.45;cursor:pointer}
#dlg.hide{display:none}
#retrato{position:absolute;left:-2px;top:-30px;width:72px;height:72px;image-rendering:pixelated;background:rgba(12,6,8,.92);border:2px solid var(--blood);display:none}
#retrato.on{display:block}
#dlg.conRetrato{padding-left:84px;min-height:52px}
@media (max-width:520px){#retrato{width:56px;height:56px;top:-22px}#dlg.conRetrato{padding-left:64px}}
#dlg strong{display:block;font-family:'Pirata One',Georgia,serif;font-weight:400;color:var(--ember);font-size:1.15em}
#dlg em{position:absolute;right:.7em;bottom:.3em;font-style:normal;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#dlg em{animation:none}}
#look,#mute,#pause{--padk:1}
#pause{position:absolute;top:6px;right:74px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--fg);font-size:13px;width:30px;height:30px;cursor:pointer}
#look{position:absolute;top:6px;right:40px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--fg);font-size:14px;width:30px;height:30px;cursor:pointer}
#mute{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--fg);font-size:14px;width:30px;height:30px;cursor:pointer}
.hint{margin:.8rem 1rem;font-size:.9rem;opacity:.65;text-align:center}
.pad{display:none;width:100%;max-width:960px;justify-content:space-between;align-items:center;padding:12px 10px;gap:8px;flex-wrap:wrap;row-gap:10px}
.pad .grp{display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0;justify-content:center}
.pad button{flex:0 0 auto;width:calc(62px * var(--padk,1));height:calc(62px * var(--padk,1));border-radius:50%;background:var(--panel);border:2px solid var(--line);color:var(--fg);font-size:22px;font-family:'Pirata One',Georgia,serif;touch-action:none}
.pad button.sm{width:calc(46px * var(--padk,1));height:calc(46px * var(--padk,1));font-size:18px}
@media (max-width:520px){.pad{padding:10px 6px;gap:6px}.pad .grp{gap:6px}.pad button{width:calc(50px * var(--padk,1));height:calc(50px * var(--padk,1));font-size:19px}.pad button.sm{width:calc(40px * var(--padk,1));height:calc(40px * var(--padk,1));font-size:16px}}
@media (max-width:380px){.pad button{width:calc(44px * var(--padk,1));height:calc(44px * var(--padk,1));font-size:17px}.pad button.sm{width:calc(36px * var(--padk,1));height:calc(36px * var(--padk,1));font-size:14px}}
.pad button.on{background:var(--blood);border-color:var(--ember)}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}}
@media (pointer:coarse) and (orientation:landscape){
 #wrap{height:100vh;width:auto;max-width:100vw}
 .pad{position:fixed;left:0;right:0;bottom:0;max-width:none;pointer-events:none}
 .pad button{pointer-events:auto;opacity:.55}
}
</style>
</head>

const FUENTES=[
 ['Mascaradas: El Legado','Idea, historia y dirección: alberto_hdez13. Juego de ficción inspirado en las mascaradas de invierno de la provincia de Zamora: personajes, escenarios y leyendas están adaptados con libertad. Lo que sigue son las tradiciones reales en que se basa cada uno. Desarrollado con ayuda de Claude (Anthropic).'],
 ['Aliste · Los Carochos','Riofrío de Aliste, 1 de enero. Once personajes en tres grupos: los diablos, los guapos (entre ellos la Madama y el Galán) y los ciegos. Declarada de Interés Turístico Regional. Documentación de la propia mascarada (loscarochos.es) y de Juan Francisco Blanco González, «Los Carochos. Rito y tradición en Aliste» (Semuret, 2004).'],
 ['El robledal · La Madama y otras mascaradas alistanas','La Madama forma pareja con el Galán en «los guapos» de las obisparras de Aliste. El Atenazador de San Vicente de la Cabeza, con sus tenazas de madera, y los Cencerrones de Abejera, cubiertos de cencerros, son otras dos mascaradas de la comarca.'],
 ['Sierra de la Culebra · La Filandorra','Ferreras de Arriba, 26 de diciembre. Los feos (Filandorra y Diablo) y los guapos (Galán y Madama). La Filandorra hila con uso y rueca, esparce ceniza y tizna; el Diablo lleva máscara de macho cabrío.'],
 ['Sanabria · La Visparra y el llobishome','San Martín de Castañeda, 5 de enero: visparras con cencerros y tenazas y talanqueiras de armazón. El llobishome, el hombre lobo de Sanabria y Las Portelas, procede de la tradición oral del noroeste zamorano. Valverde de Lucerna, el pueblo bajo el lago, lo recogió Unamuno en «San Manuel Bueno, mártir».'],
 ['Tábara · El Birria y la cabeza parlante','El Birria dirige y reprende a los danzantes de Tábara en el Corpus. La cabeza parlante es una leyenda local atribuida a un alquimista; en el juego se ha dejado fuera el motivo antisemita del relato original.'],
 ['Pozuelo · El Tafarrón y la Madama','Pozuelo de Tábara, 26 de diciembre. El Tafarrón con traje de juncos, ocho cencerros y careta de metal con cuernos de cabra y orejas de liebre; la Madama con bata de flores, la M a la espalda y la muñeca prendida con alfileres. Ficha de Bernardo Calvo Brioso para la Junta de Castilla y León, Asociación Guías Zamora, Enfoque Diario de Zamora y Zamora News.'],
 ['El Scriptorium · El Beato de Tábara','Códice del Comentario al Apocalipsis de Beato de Liébana copiado en el monasterio de Tábara en el siglo X. Su colofón nombra al maestro Magio, que murió antes de acabarlo, al pintor Emeterio y al escriba Senior. De él procede la célebre miniatura de la torre con el scriptorium, usada como referencia para el nivel.'],
 ['Sayago y Almeida · La Vaca Bayona','Almeida de Sayago, Domingo de Carnaval. Armazón de madera con cuernos cubierto con una manta. Estudiada por M.ª Pilar Panero García en «Cambio semántico en una mojiganga. La Vaca Bayona de Almeida de Sayago» (2017). La vaca que habla es de raza sayaguesa, la autóctona de la comarca.'],
 ['La plaza · El Zangarrón de Sanzoles','Sanzoles, 26 de diciembre. Traje de cuadros, mandil de colores, cencerros, vergajo y palo rematado con tres vejigas. Abre paso a la procesión de San Esteban. Declarada de Interés Turístico Regional.'],
 ['El Cerro de la Ermita · El Zangarrón de Montamarta','Montamarta, 1 y 6 de enero. Los vecinos lo llaman Zangarrina: una pernera amarilla y otra roja o marrón según el día, con flores de papel, colcha anudada, zurrón, tres cencerros a la espalda, careta de corcho y un asador de tres puntas. Interrumpe la misa de Año Nuevo y de Reyes y persigue a los mozos a brincos. Sube brincando a la ermita de Nuestra Señora del Castillo, y de su salto del arroyo depende el prestigio de la quintada. Fuentes: reportaje de Ricardo Ortega en Pueblo en Pueblo y prensa provincial.'],
 ['Las Aceñas · Los molinos del Duero','Molinos harineros movidos por la corriente del Duero en Zamora, como las aceñas de Olivares y las de Cabañales, documentadas desde la Edad Media junto a las pesqueras del río.'],
 ['La Ciudad · La catedral de Zamora','El escenario final recrea la plaza de la catedral, con el cimborrio de escamas y sus torrecillas, la torre cuadrada y la explanada de losas. Aquí no hay mascarada: por eso aparece El Olvido.'],
 ['Imágenes de referencia','La ermita de la Virgen del Castillo de Montamarta está redibujada en pixel art tomando como referencia el reportaje de Ricardo Ortega «Montamarta. La patria del Zangarrón» (Pueblo en Pueblo, 2022, puebloenpueblo.com). Se han usado además imágenes como referencia de la fuente y el lavadero de Almeida de Sayago; del árbol de Fresnadillo; y de la catedral de Zamora. La miniatura de la torre del Beato de Tábara sirvió de modelo para el scriptorium.'],

  if(P.tizne>0){ctx.fillStyle='#2a2420';ctx.fillRect(W-30,8,10,8);ctx.fillStyle='#6a6460';ctx.fillRect(W-28,10,2,2);ctx.fillRect(W-24,10,2,2);ctx.fillStyle='#3a3040';ctx.fillRect(W-30,18,10,2);ctx.fillStyle='#8a8494';ctx.fillRect(W-30,18,Math.round(10*P.tizne/1800),2)}
  if(P.wpnT>0){ctx.globalAlpha=Math.min(1,P.wpnT/20);ctx.font="9px 'Pirata One',serif";ctx.textAlign='left';ctx.fillStyle='#e8dcc0';ctx.fillText(WPN[P.wpn].name,22,25);ctx.globalAlpha=1}
  ctx.shadowColor='rgba(8,6,10,.95)';ctx.shadowBlur=3;

   for(let i=0;i<vidas;i++){const x=W-52-i*9;ctx.fillStyle='#e8dcc0';ctx.fillRect(x,48,6,6);ctx.fillStyle='#140a08';ctx.fillRect(x+1,50,1,2);ctx.fillRect(x+4,50,1,2);ctx.fillStyle='#c9a23a';ctx.fillRect(x,47,2,1);ctx.fillRect(x+4,47,2,1)}}

// ---------- bucle y controles ----------
let last=performance.now(),acc=0;
let mando=false,padPrev={},padBtnPrev=[],padAviso=0;
function leerMando(){let pads=[];try{pads=navigator.getGamepads?[...navigator.getGamepads()]:[]}catch(e){}
 const g=pads.find(p=>p&&p.connected);if(!g){if(mando){mando=false;banner('Mando desconectado','Puedes seguir con el teclado')}return}
 if(!mando){mando=true;banner('Mando conectado',g.id.split('(')[0].trim().slice(0,32)||'Listo para jugar')}
 const b=i=>!!(g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>.5));
 const ax=g.axes[0]||0,ay=g.axes[1]||0,dz=.4;
 const est={left:b(14)||ax<-dz,right:b(15)||ax>dz,down:b(13)||ay>.6,jump:b(0)||b(12),atk:b(2)||b(1),swap:b(3),roll:b(5)||b(4)||b(7)||b(6)};
 const menu=!ovEl.classList.contains('hide');
 const flanco=i=>b(i)&&!padBtnPrev[i];
 if(menu){ // navegar menús con la cruceta o el stick
  const bs=[...btnsEl.querySelectorAll('button')].filter(x=>!x.disabled);
  const act=document.activeElement,idx=bs.indexOf(act);
  const arriba=flanco(12)||(ay<-.6&&!padPrev.arriba),abajo=flanco(13)||(ay>.6&&!padPrev.abajo);
  const izq=flanco(14)||(ax<-.6&&!padPrev.izq),der=flanco(15)||(ax>.6&&!padPrev.der);
  padPrev.arriba=ay<-.6;padPrev.abajo=ay>.6;padPrev.izq=ax<-.6;padPrev.der=ax>.6;
  if(bs.length){if(idx<0&&(arriba||abajo||izq||der||flanco(0)))bs[0].focus();
   else if(arriba||izq)bs[(idx-1+bs.length)%bs.length].focus();
   else if(abajo||der)bs[(idx+1)%bs.length].focus();
   else if(flanco(0)&&idx>=0)bs[idx].click();
   else if(flanco(1)){const v=bs.find(x=>/^(Volver|Seguir)/.test(x.textContent));if(v)v.click()}}
  for(const k in est){if(padPrev['k_'+k]){keys[k]=false;padPrev['k_'+k]=false}}}
 else{for(const k in est){if(est[k]!==!!padPrev['k_'+k]){keys[k]=est[k];padPrev['k_'+k]=est[k];if(est[k])tapQ[k]=true}}
  if(flanco(9)){au();pauseGame()}
  if(flanco(8)){au();musicOn=!musicOn;if(musGain)musGain.gain.value=musicOn?.9:0;banner(musicOn?'Música':'Sin música','Botón Select')}}
 if(menu&&flanco(9)){const v=[...btnsEl.querySelectorAll('button')].find(x=>x.textContent==='Seguir');if(v)v.click()}
 padBtnPrev=g.buttons.map((x,i)=>b(i))}
addEventListener('gamepadconnected',()=>{au()});
function loop(now){leerMando();acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
const kmDEF={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ArrowDown:'down',KeyS:'down',KeyK:'roll',KeyC:'roll',KeyJ:'atk',KeyG:'look',KeyM:'music',KeyP:'pause',Escape:'pause',KeyL:'swap',KeyQ:'swap',ShiftLeft:'swap',KeyX:'atk'};
const ACC=[['left','Izquierda'],['right','Derecha'],['jump','Saltar'],['atk','Golpear / usar'],['down','Agacharse'],['roll','Rodar'],['swap','Cambiar arma'],['pause','Pausa'],['music','Música'],['look','Estilo']];
let binds={};ACC.forEach(([a])=>binds[a]=Object.keys(kmDEF).filter(c=>kmDEF[c]===a));
try{const g=JSON.parse(localStorage.getItem('cc_keys')||'null');if(g)for(const a in g)if(binds[a])binds[a]=g[a]}catch(e){}
function limpiaBinds(){const visto={};for(const[a]of ACC){binds[a]=(binds[a]||[]).filter(c=>{if(visto[c])return false;visto[c]=a;return true})}}
limpiaBinds();
let km={};function rehacerKm(){km={};for(const a in binds)binds[a].forEach(c=>km[c]=a)}rehacerKm();
function guardaKeys(){try{localStorage.setItem('cc_keys',JSON.stringify(binds))}catch(e){}}
const NOMK={Space:'Espacio',ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',ShiftLeft:'Mayús izq',ShiftRight:'Mayús der',Escape:'Esc',Enter:'Intro',Tab:'Tab'};
const nomK=c=>NOMK[c]||c.replace('Key','').replace('Digit','');
let remap=null;
let padTam=1;try{padTam=parseFloat(localStorage.getItem('cc_pad'))||1}catch(e){}
let temblor=1;try{const v=localStorage.getItem('cc_shake');temblor=v===null?1:parseFloat(v)}catch(e){}
let destellos=true;try{const v=localStorage.getItem('cc_flash');destellos=v===null?!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches):v==='1'}catch(e){}
function aplicaPad(){try{document.documentElement.style.setProperty('--padk',padTam)}catch(e){}}
aplicaPad();
function showOpciones(back){showOv('Ajustes','Controles y accesibilidad.',[
 {label:'Teclas',cb:()=>showTeclas(back)},
 {label:'Botones táctiles: '+(padTam<1?'pequeños':padTam>1?'grandes':'normales'),cb:()=>{padTam=padTam<1?1:(padTam>1?.8:1.25);try{localStorage.setItem('cc_pad',padTam)}catch(e){}aplicaPad();showOpciones(back)}},
 {label:'Temblor de pantalla: '+(temblor===0?'no':temblor<1?'suave':'normal'),cb:()=>{temblor=temblor===1?.4:(temblor===.4?0:1);try{localStorage.setItem('cc_shake',temblor)}catch(e){}showOpciones(back)}},
 {label:'Parpadeos: '+(destellos?'sí':'no'),cb:()=>{destellos=!destellos;try{localStorage.setItem('cc_flash',destellos?'1':'0')}catch(e){}showOpciones(back)}},
 {label:'Volver',cb:back}])}
function showTeclas(back){showOv(remap?'Pulsa una tecla':'Teclas',remap?('Asignando: '+(ACC.find(a=>a[0]===remap)||['',''])[1]+'. Pulsa Esc para dejarlo como está.'):'Toca una acción y pulsa la tecla que quieras. Con mando: A saltar · X golpear/usar · Y cambiar arma · RB/LB rodar · abajo agacharse · Start pausa · Select música.',
 ACC.map(([a,n])=>({label:n+': '+(binds[a].length?binds[a].map(nomK).join(' / '):'sin asignar'),cb:()=>{remap=a;showTeclas(back)}}))
 .concat([{label:'Restaurar',cb:()=>{ACC.forEach(([a])=>binds[a]=Object.keys(kmDEF).filter(c=>kmDEF[c]===a));rehacerKm();guardaKeys();showTeclas(back)}},{label:'Volver',cb:()=>showOpciones(back)}]))}
addEventListener('keydown',e=>{
 if(remap){if(e.code!=='Escape'){for(const a in binds)if(a!==remap)binds[a]=binds[a].filter(c=>c!==e.code);binds[remap]=[e.code];rehacerKm();guardaKeys()}remap=null;e.preventDefault();showTeclas(prevBack||titleScreen);return}
 const k=km[e.code];if(k==='pause'){au();pauseGame();e.preventDefault();return}
 if(k==='music'){au();musicOn=!musicOn;if(musGain)musGain.gain.value=musicOn?.9:0;banner(musicOn?'Música':'Sin música','Se cambia con M');e.preventDefault();return}
 if(k==='look'){document.getElementById('look').onclick();e.preventDefault();return}
 if(k&&ovEl.classList.contains('hide')){if(!keys[k]&&!e.repeat)tapQ[k]=true;keys[k]=true;e.preventDefault();au()}});
addEventListener('keyup',e=>{const k=km[e.code];if(k)keys[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();au();tactil=true;tapQ[k]=true;keys[k]=true;b.classList.add('on')});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{keys[k]=false;b.classList.remove('on')}))});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
genWorld();respawn();titleScreen();requestAnimationFrame(loop);
